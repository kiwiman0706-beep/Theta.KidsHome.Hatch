    const Cx=X0+S/2, Cy=Y0+S/2;
    rect(X0,Y0,S,S,'#c8d2e0');
    // 固定側
    ctx.save(); clipPoly(F.fixed); paintAt(shape,'#7fb2ec',X0,Y0,S); ctx.restore();
    // 折れる側（折り線を軸に奥行き→90°で消え→鏡像で反対側へ）
    ctx.save();
    ctx.translate(Cx,Cy); ctx.rotate(-F.ang); ctx.scale(1,c); ctx.rotate(F.ang); ctx.translate(-Cx,-Cy);
    clipPoly(F.half);
    ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.5+0.5*Math.abs(c);
    paintAt(shape,'#ef8b83',X0,Y0,S); ctx.restore();
    // 折り線
    ctx.save(); ctx.strokeStyle='#f0a93b'; ctx.lineWidth=3; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(F.line[0][0],F.line[0][1]); ctx.lineTo(F.line[1][0],F.line[1][1]); ctx.stroke(); ctx.restore();
    const pct=Math.round(st.theta/Math.PI*100);
    if(isHandDraw()) setStatus('✏️ 指やペンで模様をかこう。かけたら「✋ おる」で折って重なりを見よう');
    else setStatus(`「▶ おりたたむ」または折り線をまたぐ向きに指でドラッグして折ろう（${pct}%）。重なった形を見てね`);
  }
  function draw(){ ctx.clearRect(0,0,W,H); if(cfg.op==='fold') drawFold(); else drawStack(); }

  function stopAnim(){ if(st.raf){cancelAnimationFrame(st.raf);st.raf=0;} st.playing=false; }
  function play(){ if(st.playing) return; st.playing=true; const t0=performance.now();
    if(cfg.op==='fold'){ st.theta=0; (function s(t){ if(!st.alive)return; const k=Math.min(1,(t-t0)/1000); const e=0.5-0.5*Math.cos(Math.PI*k); st.theta=Math.PI*e; draw(); if(k<1)st.raf=requestAnimationFrame(s); else st.playing=false; })(t0); }
    else { const fx=st.tx,fy=st.ty,fa=st.ang; (function s(t){ if(!st.alive)return; const k=Math.min(1,(t-t0)/700); const e=1-Math.pow(1-k,3); st.tx=fx*(1-e); st.ty=fy*(1-e); st.ang=fa*(1-e); draw(); if(k<1)st.raf=requestAnimationFrame(s); else st.playing=false; })(t0); } }
  function reset(){ stopAnim(); if(cfg.op==='fold'){ st.theta=0; } else { const {S}=work(); st.tx=S*0.75; st.ty=-S*0.25; st.ang=0; } draw(); }

  function pointerdown(e){ cv.setPointerCapture(e.pointerId); const p=pt(e);
    if(isHandDraw()){ const s=[normPt(p)]; st.hand.push(s); st.hd=s; draw(); return; }
    stopAnim(); st.drag={x:p.x,y:p.y,sx:p.x,sy:p.y,theta0:st.theta,tx0:st.tx,ty0:st.ty}; }
  function pointermove(e){ const p=pt(e);
    if(st.hd){ const q=normPt(p); const last=st.hd[st.hd.length-1]; if(Math.hypot(q[0]-last[0],q[1]-last[1])>0.004){ st.hd.push(q); draw(); } return; }
    if(!st.drag)return; const {S}=work();
    if(cfg.op==='fold'){ const F=foldDef(); // 折れる側の中心→折り線 方向へドラッグすると折れる
      const lm=[(F.line[0][0]+F.line[1][0])/2,(F.line[0][1]+F.line[1][1])/2];
      let cxx=0,cyy=0; F.half.forEach(q=>{cxx+=q[0];cyy+=q[1];}); cxx/=F.half.length; cyy/=F.half.length;
      let dx=lm[0]-cxx, dy=lm[1]-cyy; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
      const dp=(p.x-st.drag.sx)*dx+(p.y-st.drag.sy)*dy;
      st.theta=Math.max(0,Math.min(Math.PI, st.drag.theta0 + dp/(S*0.5)*Math.PI)); }
    else { st.tx=st.drag.tx0+(p.x-st.drag.x); st.ty=st.drag.ty0+(p.y-st.drag.y); }
    draw(); }
  function up(){ if(st.hd){ st.hd=null; save('kuru_ov_hand',st.hand); return; }
    if(st.drag && cfg.op==='stack'){ const {S}=work(); if(Math.hypot(st.tx,st.ty)<S*0.12){ st.tx=0; st.ty=0; draw(); } } st.drag=null; }
  const pointerup=up,pointercancel=up,pointerleave=up;

  function toolbar(){ setToolbar(`
    <div class="seg"><button class="btn small ${cfg.op==='stack'?'on':''}" id="o_stack">かさねる</button>
    <button class="btn small ${cfg.op==='fold'?'on':''}" id="o_fold">おりたたむ</button></div>
    <div class="seg"><button class="btn small ${cfg.type==='line'?'on':''}" id="o_tl">線の形</button>
    <button class="btn small ${cfg.type==='grid'?'on':''}" id="o_tg">マス模様</button></div>
    ${cfg.op==='fold'?`<div class="seg"><button class="btn small ${cfg.foldDir==='v'?'on':''}" id="o_dv">たて</button><button class="btn small ${cfg.foldDir==='h'?'on':''}" id="o_dh">よこ</button><button class="btn small ${cfg.foldDir==='d1'?'on':''}" id="o_d1">⟍</button><button class="btn small ${cfg.foldDir==='d2'?'on':''}" id="o_d2">⟋</button></div>
      <button class="btn small ${cfg.a==='hand'?'on':''}" id="o_hand">✏️ 手書き</button>
      ${cfg.a==='hand'?`<div class="seg"><button class="btn small ${st.tool==='draw'?'on':''}" id="o_td">✏️ かく</button><button class="btn small ${st.tool==='fold'?'on':''}" id="o_tf">✋ おる</button></div><button class="btn small" id="o_clr">🧽 消す</button>`:''}`
      :`<button class="btn small" id="o_rl">↺</button><button class="btn small" id="o_rr">↻</button>`}
    <button class="btn small primary" id="o_play">▶ ${cfg.op==='fold'?'おりたたむ':'重ねる'}</button>
    <button class="btn small" id="o_reset">↩︎ もどす</button>
    <button class="btn small primary" id="o_menu">⚙️ 形をえらぶ</button>`);
    $('o_stack').onclick=()=>{cfg.op='stack';save('kuru_ov',cfg);reset();toolbar();};
    $('o_fold').onclick=()=>{cfg.op='fold';save('kuru_ov',cfg);reset();toolbar();};
    $('o_tl').onclick=()=>{cfg.type='line';cfg.a='diag';cfg.b='cross';save('kuru_ov',cfg);reset();toolbar();};
    $('o_tg').onclick=()=>{cfg.type='grid';cfg.a='ga';cfg.b='ge';save('kuru_ov',cfg);reset();toolbar();};
    if(cfg.op==='fold'){ $('o_dv').onclick=()=>{cfg.foldDir='v';save('kuru_ov',cfg);reset();toolbar();}; $('o_dh').onclick=()=>{cfg.foldDir='h';save('kuru_ov',cfg);reset();toolbar();};
      $('o_d1').onclick=()=>{cfg.foldDir='d1';save('kuru_ov',cfg);reset();toolbar();}; $('o_d2').onclick=()=>{cfg.foldDir='d2';save('kuru_ov',cfg);reset();toolbar();};
      $('o_hand').onclick=()=>{ if(cfg.a==='hand'){ cfg.a=(cfg.type==='grid'?'ga':'diag'); } else { cfg.a='hand'; st.tool='draw'; } save('kuru_ov',cfg); st.theta=0; toolbar(); draw(); };
      if(cfg.a==='hand'){ $('o_td').onclick=()=>{st.tool='draw';st.theta=0;toolbar();draw();}; $('o_tf').onclick=()=>{st.tool='fold';toolbar();draw();};
        $('o_clr').onclick=()=>{st.hand=[];save('kuru_ov_hand',st.hand);draw();}; } }
    else { $('o_rl').onclick=()=>{st.ang-=Math.PI/2;draw();}; $('o_rr').onclick=()=>{st.ang+=Math.PI/2;draw();}; }
    $('o_play').onclick=play; $('o_reset').onclick=reset; $('o_menu').onclick=drawer; }
  function drawer(){ const s=setOf(cfg.type); const opts=Object.entries(s).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
    openDrawer(`<h2>⚙️ かさねてみよう</h2>
      ${cfg.op==='fold'
        ? `<h3>おりたたむ形</h3><select id="o_a" style="width:100%;padding:8px;font-size:16px;border-radius:8px;border:1px solid var(--line)">${opts}</select>
           <p class="hint">折り線（オレンジ）で二つ折り。指で左右/上下にドラッグしてゆっくり折る、または「▶ おりたたむ」。折り重なった形が濃く出ます。</p>`
        : `<h3>1まいめ（青）</h3><select id="o_a" style="width:100%;padding:8px;font-size:16px;border-radius:8px;border:1px solid var(--line)">${opts}</select>
           <h3>2まいめ（赤・動かせる）</h3><select id="o_b" style="width:100%;padding:8px;font-size:16px;border-radius:8px;border:1px solid var(--line)">${opts}</select>
           <p class="hint">2枚をドラッグして重ね、合わさった形を確認。「▶ 重ねる」で自動で重なります。</p>`}`);
    $('o_a').value=cfg.a; $('o_a').onchange=e=>{cfg.a=e.target.value;save('kuru_ov',cfg);draw();};
    if(cfg.op==='stack'){ $('o_b').value=cfg.b; $('o_b').onchange=e=>{cfg.b=e.target.value;save('kuru_ov',cfg);draw();}; } }
  return { draw, pointerdown, pointermove, pointerup, pointercancel, pointerleave,
    mount(){ st.alive=true; toolbar(); reset(); }, unmount(){ st.alive=false; stopAnim(); } };
}
/* =========================================================================
   モジュール10: きおくゲーム  テスト2（記憶）
   絵と向き（右/左）を覚えて、同じものを当てる。正誤つき・ランダム出題。
   ※ POOL に画像を足せば拡張可（今は絵文字）
   ========================================================================= */
function MemoryModule(){
  const POOL=[
    {e:'🐧',n:'ペンギン'},{e:'🐤',n:'ひよこ'},{e:'🦆',n:'あひる'},{e:'🐕',n:'いぬ'},{e:'🐈',n:'ねこ'},
    {e:'🐎',n:'うま'},{e:'🐘',n:'ぞう'},{e:'🐊',n:'わに'},{e:'🦖',n:'きょうりゅう'},{e:'🐇',n:'うさぎ'},
    {e:'🐢',n:'かめ'},{e:'🦩',n:'フラミンゴ'},{e:'🐁',n:'ねずみ'},{e:'🐛',n:'いもむし'},{e:'🦋',n:'ちょう'},
    {e:'🚗',n:'くるま'},{e:'🚌',n:'バス'},{e:'🚕',n:'タクシー'},{e:'🏎️',n:'レーシングカー'},{e:'🚲',n:'じてんしゃ'},
    {e:'🛵',n:'スクーター'},{e:'✈️',n:'ひこうき'},{e:'🚀',n:'ロケット'},{e:'⛵',n:'ヨット'},{e:'🏃',n:'はしる人'},
  ];
  const cfg=Object.assign({k:3, sec:5, choices:4, useDir:true}, load('kuru_mem')||{});
  let st={phase:'idle', items:[], qi:0, ans:[], choices:[], rects:[], feedback:null, t0:0, dur:0, raf:0, alive:true};

  function glyphF(e,x,y,size,dir){ ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`${Math.round(size)}px -apple-system,"Noto Color Emoji","Noto Sans JP",sans-serif`;
    ctx.translate(x,y); ctx.scale(dir||1,1); ctx.fillText(e,0,0); ctx.restore(); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function pick(n){ return shuffle(POOL.slice()).slice(0,n); }
  const dir=()=> cfg.useDir ? (Math.random()<0.5?-1:1) : 1;

  function stopLoop(){ if(st.raf){cancelAnimationFrame(st.raf);st.raf=0;} }
  function start(){ stopLoop(); const items=pick(cfg.k).map(it=>({it, d:dir()}));
    st.items=items; st.qi=0; st.ans=[]; st.phase='show'; st.t0=performance.now(); st.dur=cfg.sec*1000; toolbar(); loop(); }
  function loop(){ if(st.phase!=='show'||!st.alive) return; const el=performance.now()-st.t0;
    if(el>=st.dur){ toQuiz(); return; } draw(); st.raf=requestAnimationFrame(loop); }
  function toQuiz(){ stopLoop(); st.phase='quiz'; st.qi=0; buildChoices(); toolbar(); draw(); }
  function buildChoices(){ const cur=st.items[st.qi]; const list=[{it:cur.it,d:cur.d,correct:true}]; const seen=new Set([cur.it.e+cur.d]);
    if(cfg.useDir){ const k=cur.it.e+(-cur.d); if(!seen.has(k)){ seen.add(k); list.push({it:cur.it,d:-cur.d,correct:false}); } }
    const others=shuffle(POOL.filter(p=>p.e!==cur.it.e));
    for(const o of others){ if(list.length>=cfg.choices) break; const d=dir(); const k=o.e+d; if(!seen.has(k)){ seen.add(k); list.push({it:o,d,correct:false}); } }
    st.choices=shuffle(list); st.feedback=null; }
  function answer(i){ if(st.feedback) return; const c=st.choices[i]; st.feedback={i, correct:c.correct};
    st.ans[st.qi]={chosen:c, correct:c.correct}; draw();
    setTimeout(()=>{ if(!st.alive) return; if(st.qi<st.items.length-1){ st.qi++; buildChoices(); draw(); } else { st.phase='result'; toolbar(); draw(); } }, 850); }

  function draw(){ ctx.clearRect(0,0,W,H);
    if(st.phase==='idle'){ ctx.textAlign='center'; ctx.fillStyle='#334'; ctx.font='bold 26px sans-serif';
      ctx.fillText('🧠 きおくゲーム', cx, cy-40); ctx.font='16px sans-serif'; ctx.fillStyle='#678';
      ctx.fillText(`${cfg.k}この 絵と むき を おぼえて、あとで あてよう`, cx, cy);
      ctx.fillText('「▶ スタート」で はじまるよ', cx, cy+28); return; }
    if(st.phase==='show'){ const n=st.items.length, cellW=Math.min(W/(n+1),160), sz=cellW*0.7, y=cy;
      const sx=cx-n*cellW/2;
      ctx.textAlign='center'; ctx.fillStyle='#334'; ctx.font='bold 22px sans-serif'; ctx.fillText('よく おぼえてね！', cx, cy-cellW*0.9);
      st.items.forEach((m,i)=>{ const x=sx+i*cellW+cellW/2; glyphF(m.it.e,x,y,sz,m.d);
        ctx.fillStyle='#8090a2'; ctx.font='14px sans-serif'; ctx.fillText(`${i+1}`, x, y+cellW*0.55); });
      // タイムバー
      const rem=Math.max(0,1-(performance.now()-st.t0)/st.dur); const bw=Math.min(W*0.6,420);
      ctx.fillStyle='#e6ebf2'; ctx.fillRect(cx-bw/2, cy+cellW*0.95, bw, 12);
      ctx.fillStyle='#2b6cb0'; ctx.fillRect(cx-bw/2, cy+cellW*0.95, bw*rem, 12); return; }
    if(st.phase==='quiz'){ ctx.textAlign='center'; ctx.fillStyle='#334'; ctx.font='bold 22px sans-serif';
      ctx.fillText(`${st.qi+1}ばんめ は どれ？（${st.qi+1}/${st.items.length}）`, cx, H*0.16);
      const n=st.choices.length, cellW=Math.min(W/(n+0.5),190), gap=cellW*0.12, sz=cellW-gap*2, oy=cy-sz/2, sx=cx-n*cellW/2; st.rects=[];
      st.choices.forEach((c,i)=>{ const ox=sx+i*cellW+gap;
        ctx.fillStyle='#fff'; ctx.strokeStyle='#c8d2e0'; ctx.lineWidth=2; roundRect(ox,oy,sz,sz,14); ctx.fill(); ctx.stroke();
        glyphF(c.it.e, ox+sz/2, oy+sz/2, sz*0.6, c.d);
        if(st.feedback&&st.feedback.i===i){ ctx.font='40px sans-serif'; ctx.fillText(c.correct?'⭕️':'❌', ox+sz/2, oy+sz/2); }
        st.rects.push({x:ox,y:oy,w:sz,h:sz,i}); });
      const done=st.ans.filter(a=>a&&a.correct).length; setStatus(`せいかい ${done} ／ ${st.items.length}`); return; }
    if(st.phase==='result'){ const score=st.ans.filter(a=>a&&a.correct).length;
      ctx.textAlign='center'; ctx.fillStyle='#334'; ctx.font='bold 28px sans-serif';
      ctx.fillText(`${st.items.length}もん中 ${score}もん せいかい！`, cx, H*0.2);
      const n=st.items.length, cellW=Math.min(W/(n+1),150), sz=cellW*0.52, y=cy; const sx=cx-n*cellW/2;
      ctx.font='14px sans-serif'; ctx.fillStyle='#678'; ctx.fillText('でた絵（上）と えらんだ絵（下）', cx, y-cellW*0.7);
      st.items.forEach((m,i)=>{ const x=sx+i*cellW+cellW/2; glyphF(m.it.e,x,y-cellW*0.35,sz,m.d);
        const a=st.ans[i]; if(a) glyphF(a.chosen.it.e,x,y+cellW*0.35,sz,a.chosen.d);
        ctx.font='26px sans-serif'; ctx.fillText(a&&a.correct?'⭕️':'❌', x, y); });
      setStatus('「🔄 もう一度」で あたらしい もんだい'); return; }
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function pointerdown(e){ if(st.phase!=='quiz'||st.feedback) return; const p=pt(e);
    for(const r of st.rects){ if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){ answer(r.i); break; } } }

  function toolbar(){ let btns='';
    if(st.phase==='idle') btns=`<button class="btn small primary" id="m_start">▶ スタート</button>`;
    else if(st.phase==='show') btns=`<button class="btn small" id="m_hide">🙈 かくす</button>`;
    else if(st.phase==='result') btns=`<button class="btn small primary" id="m_again">🔄 もう一度</button>`;
    else btns=`<button class="btn small" id="m_again2">やめる</button>`;
    setToolbar(`${btns}<button class="btn small primary" id="m_menu">⚙️ せってい</button>`);
    if($('m_start'))$('m_start').onclick=start;
    if($('m_hide'))$('m_hide').onclick=toQuiz;
    if($('m_again'))$('m_again').onclick=start;
    if($('m_again2'))$('m_again2').onclick=()=>{stopLoop();st.phase='idle';toolbar();setStatus('');draw();};
    $('m_menu').onclick=drawer; }
  function drawer(){ openDrawer(`<h2>⚙️ きおくゲーム</h2>
    <h3>おぼえる数</h3><div class="row"><input type="range" id="m_k" min="2" max="6" value="${cfg.k}"><span id="m_kv">${cfg.k}</span></div>
    <h3>見る時間（びょう）</h3><div class="row"><input type="range" id="m_s" min="2" max="12" value="${cfg.sec}"><span id="m_sv">${cfg.sec}</span></div>
    <h3>えらぶ数（選択肢）</h3><div class="row"><input type="range" id="m_c" min="2" max="4" value="${cfg.choices}"><span id="m_cv">${cfg.choices}</span></div>
    <h3>向き（右/左）も かえる</h3><div class="row"><button class="btn small ${cfg.useDir?'on':''}" id="m_dir">${cfg.useDir?'ON':'OFF'}</button></div>
    <p class="hint">絵＋向きを覚えて、同じ絵を当てるゲーム（正誤つき・毎回ランダム）。あとで画像を追加して問題を増やせます。</p>`);
    $('m_k').oninput=e=>{cfg.k=+e.target.value;$('m_kv').textContent=cfg.k;save('kuru_mem',cfg);};
    $('m_s').oninput=e=>{cfg.sec=+e.target.value;$('m_sv').textContent=cfg.sec;save('kuru_mem',cfg);};
    $('m_c').oninput=e=>{cfg.choices=+e.target.value;$('m_cv').textContent=cfg.choices;save('kuru_mem',cfg);};
    $('m_dir').onclick=()=>{cfg.useDir=!cfg.useDir;save('kuru_mem',cfg);drawer();}; }
  return { draw, pointerdown, mount(){ st.alive=true; st.phase='idle'; toolbar(); draw(); }, unmount(){ st.alive=false; stopLoop(); } };
}

/* =========================================================================
   モジュール11: おかね  テスト5（数量）
   コインを置く/動かす/薄くする(使った)/両替、ペン書き込み、のこり自動集計
   ========================================================================= */
function MoneyModule(){
  const YEN={
    1:{c:'#d0d3d5', edge:'#a7abad', hole:false, txt:'#555', r:0.82},
    5:{c:'#d8b36a', edge:'#a9863f', hole:true, txt:'#6b4e1e', r:0.94},
    10:{c:'#c47c46', edge:'#8f5a2e', hole:false, txt:'#fff', r:1.0},
    50:{c:'#d6d9db', edge:'#a7abad', hole:true, txt:'#555', r:0.92},
    100:{c:'#d6d9db', edge:'#a7abad', hole:false, txt:'#444', r:1.06},
    500:{c:'#e0c05a', edge:'#b0913e', hole:false, txt:'#5f4a12', r:1.18},
  };
  const DENOMS=[1,5,10,50,100,500];
  const PENCOL=['#e0322e','#222','#2b6cb0'];
  const saved=load('kuru_money')||{};
  let st={coins:saved.coins||[], pen:saved.pen||[], tool:'move', drag:null, hd:null, penColor:'#e0322e', nextId:saved.nextId||1};
  function baseR(){ return Math.min(W,H)*0.05; }
  function persist(){ save('kuru_money',{coins:st.coins, pen:st.pen, nextId:st.nextId}); }

  function drawCoin(co){ const d=YEN[co.v], r=baseR()*d.r; ctx.save(); if(co.spent) ctx.globalAlpha=0.22;
    ctx.beginPath(); ctx.arc(co.x,co.y,r,0,7); ctx.fillStyle=d.c; ctx.fill();
    ctx.lineWidth=Math.max(2,r*0.09); ctx.strokeStyle=d.edge; ctx.stroke();
    if(d.hole){ ctx.beginPath(); ctx.arc(co.x,co.y,r*0.34,0,7); ctx.fillStyle='#eef2f7'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=d.edge; ctx.stroke(); }
    ctx.fillStyle=d.txt; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`bold ${Math.round(r*0.58)}px sans-serif`;
    ctx.fillText(String(co.v), co.x, co.y + (d.hole? r*0.5 : 0)); ctx.restore(); }

  function total(){ let rem=0,used=0,n=0; st.coins.forEach(c=>{ if(c.spent) used+=c.v; else { rem+=c.v; n++; } }); return {rem,used,n}; }
  function drawPanel(){ const t=total(); ctx.textAlign='left'; ctx.fillStyle='#233'; ctx.font='bold 26px sans-serif';
    ctx.fillText(`のこり ${t.rem} 円`, 20, 34); ctx.font='14px sans-serif'; ctx.fillStyle='#8090a2';
    ctx.fillText(`つかった ${t.used} 円 ／ コイン ${t.n} こ（うすいのは「つかった」）`, 20, 58); }

  function draw(){ ctx.clearRect(0,0,W,H); st.coins.forEach(drawCoin);
    st.pen.forEach(s=>{ ctx.strokeStyle=s.color; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
      if(s.pts.length===1){ ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(s.pts[0].x,s.pts[0].y,2,0,7); ctx.fill(); return; }
      ctx.beginPath(); s.pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); });
    drawPanel(); }

  function addCoin(v){ st.coins.push({id:st.nextId++, v, x:cx+(Math.random()-0.5)*180, y:cy+(Math.random()-0.4)*140, spent:false}); persist(); draw(); }

  function pointerdown(e){ cv.setPointerCapture(e.pointerId); const p=pt(e);
    if(st.tool==='pen'){ const s={color:st.penColor, pts:[{x:p.x,y:p.y}]}; st.pen.push(s); st.hd=s; draw(); return; }
    for(let i=st.coins.length-1;i>=0;i--){ const co=st.coins[i], r=baseR()*YEN[co.v].r;
      if(Math.hypot(p.x-co.x,p.y-co.y)<=r){ st.drag={co,ox:co.x-p.x,oy:co.y-p.y,dx0:p.x,dy0:p.y,moved:false};
        st.coins.splice(i,1); st.coins.push(co); draw(); return; } } }
  function pointermove(e){ const p=pt(e);
    if(st.hd){ const l=st.hd.pts[st.hd.pts.length-1]; if(Math.hypot(p.x-l.x,p.y-l.y)>2){ st.hd.pts.push({x:p.x,y:p.y}); draw(); } return; }
    if(!st.drag) return; if(Math.hypot(p.x-st.drag.dx0,p.y-st.drag.dy0)>5) st.drag.moved=true;
    st.drag.co.x=p.x+st.drag.ox; st.drag.co.y=p.y+st.drag.oy; draw(); }
  function up(){ if(st.hd){ st.hd=null; persist(); return; }
    if(st.drag){ if(!st.drag.moved){ st.drag.co.spent=!st.drag.co.spent; } persist(); draw(); } st.drag=null; }
  const pointerup=up,pointercancel=up,pointerleave=up;

  function toolbar(){ setToolbar(`
    ${DENOMS.map(v=>`<button class="btn small" data-add="${v}" style="font-weight:bold">${v}円</button>`).join('')}
    <div class="seg"><button class="btn small ${st.tool==='move'?'on':''}" id="mo_move">✋ うごかす</button><button class="btn small ${st.tool==='pen'?'on':''}" id="mo_pen">✏️ かきこみ</button></div>
    ${st.tool==='pen'?PENCOL.map(c=>`<button class="btn small" data-pc="${c}" style="width:32px;padding:0;background:${c};${st.penColor===c?'outline:3px solid #233;outline-offset:1px':''}">&nbsp;</button>`).join('')+'<button class="btn small" id="mo_pclr">🧽 ペン消す</button>':''}
    <button class="btn small" id="mo_clr">🗑️ ぜんぶ</button>`);
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCoin(+b.dataset.add));
    $('mo_move').onclick=()=>{st.tool='move';toolbar();};
    $('mo_pen').onclick=()=>{st.tool='pen';toolbar();};
    document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{st.penColor=b.dataset.pc;toolbar();});
    if($('mo_pclr'))$('mo_pclr').onclick=()=>{st.pen=[];persist();draw();};
    $('mo_clr').onclick=()=>{ if(st.coins.length||st.pen.length){ st.coins=[];st.pen=[];persist();draw(); } }; }
  return { draw, pointerdown, pointermove, pointerup, pointercancel, pointerleave,
    mount(){ toolbar(); setStatus('上のボタンでコインを出す→ドラッグで動かす／タップで「うすく（使った）」。のこりは自動で計算'); draw(); }, unmount(){} };
}

/* =========================================================================
   モジュール12: おはなしづくり（絵を見てお話）  口頭試問・絵の説明
   場面×人物(ポーズ/表情)×小物 をランダム生成。質問プロンプト付き。
   ========================================================================= */
function StoryModule(){
  // 絵カード（ChatGPT等で作った実画像）。app/scenes に同梱＋端末へ追加も可
  const BUNDLED=Array.from({length:12},(_,i)=>`scenes/scene${String(i+1).padStart(2,'0')}.jpg`);
  const QS=['① これは どんな ばしょ？','② だれが いる？','③ なにを して いる？','④ どうして そう なった？','⑤ どんな きもち／この あと どう なる？'];
  let st={list:[], order:[], pos:0, cache:{}, fileInput:null};
  function loadCustom(){ return load('kuru_story_custom')||[]; }
  function rebuild(keepSrc){ st.list=BUNDLED.concat(loadCustom());
    st.order=st.list.map((_,i)=>i); for(let i=st.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[st.order[i],st.order[j]]=[st.order[j],st.order[i]];}
    st.pos=0; if(keepSrc){ const k=st.order.findIndex(i=>st.list[i]===keepSrc); if(k>=0)st.pos=k; } }
  function curSrc(){ return st.list[st.order[st.pos]]; }
  function getImg(src){ if(st.cache[src])return st.cache[src]; const im=new Image(); im.onload=()=>{ if(curSrc()===src) draw(); }; im.src=src; st.cache[src]=im; return im; }

  function pic(){ const bw=Math.min(W-40,(H-150)*1.32); const bh=Math.min(H-150,bw/1.32); return {x:cx-bw/2,y:16,w:bw,h:bh}; }
  function draw(){ ctx.clearRect(0,0,W,H); const b=pic();
    ctx.fillStyle='#fff'; ctx.fillRect(b.x,b.y,b.w,b.h);
    const src=curSrc(); const im=src?getImg(src):null;
    if(im&&im.complete&&im.naturalWidth){ const ar=im.naturalWidth/im.naturalHeight, br=b.w/b.h; let dw,dh;
      if(ar>br){ dw=b.w; dh=b.w/ar; } else { dh=b.h; dw=b.h*ar; }
      ctx.drawImage(im, b.x+(b.w-dw)/2, b.y+(b.h-dh)/2, dw, dh); }
    else { ctx.fillStyle='#8090a2'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.fillText('よみこみ中…', cx, b.y+b.h/2); }
    ctx.save(); ctx.strokeStyle='#334'; ctx.lineWidth=3; ctx.strokeRect(b.x,b.y,b.w,b.h); ctx.restore();
    // 番号
    ctx.fillStyle='#8090a2'; ctx.font='13px sans-serif'; ctx.textAlign='right';
    ctx.fillText(`${st.pos+1} / ${st.list.length}`, b.x+b.w, b.y+b.h+16);
    // 質問
    const qy=b.y+b.h+16; ctx.textAlign='left'; ctx.fillStyle='#233'; ctx.font='bold 15px sans-serif';
    ctx.fillText('この えを みて、おはなし してね：', b.x, qy);
    ctx.font='14px sans-serif'; ctx.fillStyle='#456';
    QS.forEach((q,i)=>{ ctx.fillText(q, b.x+(i%2)*b.w*0.5, qy+22+Math.floor(i/2)*22); });
    setStatus('「これはどんな場？」「何をしている？」「どうしてそうなった？」を自分の言葉で話そう。📷で保存・印刷も');
  }
  function next(d){ st.pos=(st.pos+d+st.order.length)%st.order.length; draw(); }

  function addImages(files){ let left=files.length; if(!left) return;
    Array.from(files).forEach(f=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); const data=c.toDataURL('image/jpeg',0.82);
      const cus=loadCustom(); cus.push(data); save('kuru_story_custom',cus);
      if(--left===0){ rebuild(); draw(); toolbar(); } }; im.src=r.result; }; r.readAsDataURL(f); }); }

  function toolbar(){ const nCus=loadCustom().length; setToolbar(`
    <button class="btn small" id="s_prev">◀ まえ</button>
    <button class="btn small primary" id="s_next">つぎ ▶</button>
    <button class="btn small" id="s_add">➕ 絵をついか</button>
    ${nCus?`<button class="btn small" id="s_del">🗑️ ついかを消す(${nCus})</button>`:''}`);
    $('s_prev').onclick=()=>next(-1); $('s_next').onclick=()=>next(1);
    $('s_add').onclick=()=>{ if(!st.fileInput){ st.fileInput=document.createElement('input'); st.fileInput.type='file'; st.fileInput.accept='image/*'; st.fileInput.multiple=true; st.fileInput.style.display='none'; document.body.appendChild(st.fileInput);
      st.fileInput.onchange=e=>{ addImages(e.target.files); e.target.value=''; }; } st.fileInput.click(); };
    if($('s_del'))$('s_del').onclick=()=>{ if(confirm('ついかした絵を全部消しますか？')){ save('kuru_story_custom',[]); rebuild(); draw(); toolbar(); } }; }
  return { draw, mount(){ rebuild(); toolbar(); draw(); }, unmount(){} };
}

/* =========================================================================
   モジュール定義（ホーム表示）
   ========================================================================= */
const MODULES={
  wheel:{ title:'回転盤', icon:'🎡', desc:'円ばんを回して、だれの前に何がくるか。観覧車・二重円に対応。', make:WheelModule, tag:'回転推理' },
  rotate:{ title:'回転図形', icon:'🔄', desc:'図形を指でぐりぐり回して、90°・180°でどう変わるか見る。裏返しも。', make:RotateModule, tag:'回転' },
  overlay:{ title:'かさねてみよう', icon:'🔲', desc:'2枚の透明な形をドラッグして重ね、合わさった形を見る。', make:OverlayModule, tag:'重ね' },
  roll:{ title:'タイル転がし', icon:'🎲', desc:'模様のタイルを1マスずつ転がして、向きの変化を見る。', make:RollModule, tag:'回転' },
  view4:{ title:'積み木3D', icon:'🧊', desc:'つみ木を指で自由にぐりぐり回す本物の3D。三面図も表示。自分で組める。', make:View4Module, tag:'立体' },
  grid:{ title:'マス目の回転', icon:'⬛', desc:'記号を置いた盤面をぐりぐり回して位置を追う。', make:GridRotModule, tag:'位置' },
  compose:{ title:'図形構成', icon:'🧩', desc:'パーツをドラッグ＆回転して形を作る。', make:ComposeModule, tag:'構成' },
  divide:{ title:'線で分ける', icon:'〰️', desc:'ペンで線を引いて両がわの数をくらべる。', make:DivideModule, tag:'数量' },
  draw:{ title:'ホワイトボード', icon:'🖊️', desc:'じゆうにお絵かき。ペン対応・保存・画像書き出し・共有。板書にも。', make:DrawModule, tag:'えがく' },
  memory:{ title:'きおくゲーム', icon:'🧠', desc:'絵と向き（右/左）を覚えて、同じものを当てる。正誤つき・ランダム出題。', make:MemoryModule, tag:'記憶' },
  money:{ title:'おかね', icon:'🪙', desc:'コインを置く・動かす・薄くする（使った）・両替。ペン書き込み。のこりを自動集計。', make:MoneyModule, tag:'数量' },
  story:{ title:'おはなしづくり', icon:'🖼️', desc:'絵を見てお話しする練習（口頭試問）。12場面の絵カード＋自分の絵を追加。質問つき・📷保存/印刷。', make:StoryModule, tag:'口頭試問' },
};
/* おぼえる表・プリント（静的HTML。全画面ビューアで表示＋印刷） */
const SHEETS=[
  {file:'uku-shizumu.html',      icon:'🛟', title:'うくもの・しずむもの', desc:'水にうく／しずむの分類とひっかけ'},
  {file:'tsuchi-yasai.html',     icon:'🥕', title:'つちのうえ・つちのなか', desc:'土の上／中で育つ野菜'},
  {file:'kisetsu-hana.html',     icon:'🌸', title:'きせつのはな（表）', desc:'春夏秋冬の花のまとめ'},
  {file:'kisetsu-hana-svg.html', icon:'🌼', title:'きせつのはな（絵つき）', desc:'花びらの形つきイラスト'},
  {file:'tamago-akachan.html',   icon:'🥚', title:'たまご・あかちゃん', desc:'卵で生まれる／赤ちゃんで生まれる'},
  {file:'nyushi-4set.html',      icon:'📚', title:'入試プリント4枚セット', desc:'おぼえよう！4枚まとめ'},
];
function buildHome(){ const g=$('moduleGrid'); g.innerHTML='';
  Object.entries(MODULES).forEach(([id,m])=>{ const c=document.createElement('div');
    c.className='card'+(m.soon?' soon':''); c.innerHTML=`<div class="ico">${m.icon}</div>
      <h3>${m.title}</h3><p>${m.desc}</p>
      <span class="badge ${m.soon?'soon':''}">${m.soon?'じゅんび中':m.tag}</span>`;
    if(!m.soon) c.onclick=()=>openModule(id); g.appendChild(c); });
  const sg=$('sheetGrid'); sg.innerHTML='';
  SHEETS.forEach(s=>{ const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="ico">${s.icon}</div><h3>${s.title}</h3><p>${s.desc}</p><span class="badge">プリント</span>`;
    c.onclick=()=>openSheet(s); sg.appendChild(c); });
}
function openSheet(s){ $('sheetTitle').textContent=s.title; $('sheetFrame').src='sheets/'+s.file;
  $('sheetView').classList.add('show'); }
function closeSheet(){ $('sheetView').classList.remove('show'); $('sheetFrame').src='about:blank'; }
$('sheetBack').onclick=closeSheet;
$('sheetPrint').onclick=()=>{ const f=$('sheetFrame'); try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(_){ window.print(); } };

/* ---------- 保存 ---------- */
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}
function load(k){ try{const t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(_){return null;}}

/* ---------- 起動 ---------- */
buildHome();
resize();

/* ---------- PWA: Service Worker 登録（file://では無効・httpsで有効） ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.KidsHome){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>

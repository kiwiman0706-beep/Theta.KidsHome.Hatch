name: Release APK

# アプリの自動更新は、ここで作る GitHub Release を見に行く。
# 使い方：app/build.gradle.kts の versionName を上げてから、
#   Actions → Release APK → Run workflow で版（例 v0.2.0）を入れて実行する
#   （または v0.2.0 のようなタグをプッシュする）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版（例：v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 版を決める
        id: v
        run: |
          tag="${{ github.event.inputs.version || github.ref_name }}"
          case "$tag" in v*) ;; *) tag="v$tag";; esac
          ver="${tag#v}"
          grep -q "versionName = \"$ver\"" app/build.gradle.kts || { echo "::error::app/build.gradle.kts の versionName が $ver ではありません"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: TEPRA-Print SDK（シークレット が ある とき だけ）
        # KING JIM の SDK は 使用許諾 が いる ので 公開 リポジトリ には 置かない。
        # 非公開 リポジトリ の tepra-sdk/ に TepraPrint.jar と <abi>/libTepraPrint.so を 置き、
        # このリポジトリ の シークレット TEPRA_SDK_TOKEN（読みとり 専用）を 入れる と テプラ 印刷 つき に なる。
        env:
          TOKEN: ${{ secrets.TEPRA_SDK_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "TEPRA SDK なし（テプラ 印刷 は 画像 共有 に なる）"; exit 0; }
          api=https://api.github.com/repos/kiwiman0706-beep/Theta.Kidshome.Hatch.Closed/contents/tepra-sdk
          get() { curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" "$api/$1" -o "$2"; }
          mkdir -p app/libs
          if get TepraPrint.jar app/libs/TepraPrint.jar && unzip -tq app/libs/TepraPrint.jar >/dev/null; then
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              mkdir -p app/src/main/jniLibs/$abi
              get $abi/libTepraPrint.so app/src/main/jniLibs/$abi/libTepraPrint.so || rm -f app/src/main/jniLibs/$abi/libTepraPrint.so
            done
            echo "TEPRA SDK あり"; ls -la app/libs app/src/main/jniLibs/*
          else
            echo "::warning::TEPRA SDK を とれません でした（テプラ なし で つくります）"
            rm -rf app/libs/TepraPrint.jar app/src/main/jniLibs
          fi
      - name: シリーズ 共通 の 鍵（Secret）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::Secret ANDROID_KEYSTORE_B64 が ありません（Theta.Hatch.Series の tools/sync-secrets で 配る）"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/theta-hatch.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/theta-hatch.jks" >> "$GITHUB_ENV"
      - run: ./gradlew testDebugUnitTest assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 署名 が シリーズ 共通 の 鍵 か
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          # secrets/README.md の SHA-256（更新 ハブ も これ で 照合 する）
          grep -qi "SHA-256 digest: f47740d8549bc1c37feb00b18780d80b52758b60252ba0d2217d83ab3f012a23" certs.txt || { echo "::error::共通 の 鍵 で 署名 されて いません"; exit 1; }
      - name: APK とハッシュ
        run: |
          mkdir -p out
          # シリーズ の きまり：APK は 1 つ だけ、名前 は Theta<名前>Hatch-<版>.apk（spec §6.1）
          cp app/build/outputs/apk/release/app-release.apk "out/ThetaKidsHomeHatch-${{ steps.v.outputs.ver }}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${{ steps.v.outputs.tag }}" in *-*) pre="--prerelease";; esac
          gh release create "${{ steps.v.outputs.tag }}" out/*.apk out/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Theta KidsHome Hatch ${{ steps.v.outputs.ver }}" --generate-notes $pre
